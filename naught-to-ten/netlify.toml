# Naught to Ten — Netlify configuration
# The site is plain static files, so there is nothing to build. Netlify serves
# the folder as-is and reads the enquiry forms out of the HTML at deploy time.

[build]
  publish = "."
  command = ""

# The site loads nothing from anywhere else, so the policy can be strict.
# 'unsafe-inline' covers the small inline scripts (the .js class flag, the
# frame payload in the offline bundles) and the inline background-image styles.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; form-action 'self'; frame-ancestors 'self'; base-uri 'self'"

# Fingerprinted-by-content assets never change under the same name.
[[headers]]
  for = "/assets/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photographs and editorial crops. Not content-hashed, so a week rather than a
# year — long enough to matter on a repeat visit, short enough that replacing
# a founder photo is visible without renaming the file.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The single-file bundles are downloads, not pages to be indexed.
[[headers]]
  for = "/naught-to-ten-*.html"
  [headers.values]
    X-Robots-Tag = "noindex"
